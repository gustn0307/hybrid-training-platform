# 개발용 포트는 127.0.0.1에만 공개하며 서비스 간에는 Compose 네트워크를 사용한다.
name: ai-love-workout-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_love_workout}
      POSTGRES_USER: ${POSTGRES_USER:-ai_love_workout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or local .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    # 컨테이너를 중지·재생성해도 DB 데이터를 유지하는 명명된 볼륨이다.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$로 Compose 치환을 피하고 컨테이너 셸에서 환경 변수를 확장한다.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  ai-service:
    build: ../ai-service
    ports:
      - "127.0.0.1:${AI_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ../backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ai_love_workout}
      POSTGRES_USER: ${POSTGRES_USER:-ai_love_workout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or local .env}
      # 호스트 공개 포트가 아닌 내부 서비스 이름으로 Spring Boot가 FastAPI를 호출한다.
      AI_SERVICE_URL: http://ai-service:8000
      BACKEND_PORT: 8080
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    # DB·AI의 헬스 확인 후 시작하며 실제 인증·연결 성공은 백엔드 의존성 API로 확인한다.
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  frontend:
    build: ../frontend
    environment:
      # 브라우저가 아닌 Vite 서버의 프록시 대상이다.
      BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
